title: SingLinkVPN Open Source
description: Public VPN development documentation, security research, performance methodology, datasets, and open-source research tools from SingLinkLabs.
url: https://singlinklabs.github.io
baseurl: /singlink-vpn-open-source
repository: SingLinkLabs/singlink-vpn-open-source
theme: minima
lang: en
author: SingLinkLabs
github_username: SingLinkLabs
defaults:
  - scope:
      path: README.zh-CN.md
    values:
      layout: default
      lang: zh-Hans
      title: 星连VPN开源与技术研究
      description: 星连VPN官方开源与技术研究资料，包含VPN开发、安全与隐私、性能测试方法、公开数据和研究工具。
      image: /assets/images/singlinkvpn-open-source-plan.zh-CN.webp
  - scope:
      path: README.zh-HK.md
    values:
      layout: default
      lang: zh-Hant
      title: 星連VPN開源與技術研究
      description: 星連VPN官方開源與技術研究資料，包含VPN開發、安全與私隱、效能測試方法、公開數據及研究工具。
      image: /assets/images/singlinkvpn-open-source-plan.zh-HK.webp
header_pages:
  - README.md
  - README.zh-CN.md
  - README.zh-HK.md
exclude:
  - tools
  - tests
  - Gemfile.lock
